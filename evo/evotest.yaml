# ripple-image: "ghcr.io/amousavigourabi/docker-rippled/seeded-2.4.0-fully-lowered-threshold:latest"
# ripple-image: "xrpllabsofficial/xrpld:2.6.0"
# ripple-image: "xrpllabsofficial/xrpld:3.1.0"
# ripple-image: "xrpld:1.4.0-local"
# ripple-image: "xrpld:1.7.2-local"
# ripple-image: "xrpld:2.6.0-local"
# ripple-image: "xrpld:2.6.0-byzzfuzz-local"
ripple-image: "xrpld:2.6.0-bug5-local"


seed: 98

max_generation: 100
population_size: 10
max_ledger_seq: 15

encoding:
  # Delay
  min_value: 0 # Minimum delay value in milliseconds
  max_value: 100 # Maximum delay value in milliseconds


rust_log_level: "info"
# rust_log_level: "debug"

byzz_min_seq: 5
byzz_max_seq: 10



strategy: EvoDelayStrategy
strategy: RandomDelayByzzStrategy
# strategy: RandomByzzStrategy
# strategy: RandomDelayStrategy

timeout_sec_per_seq: 30


# fitness_function: "num_propose_set"
# fitness_function: "num_getledger_hashes"
# fitness_function: "num_getledger_messages"
# fitness_function: "mean_validation_time"
fitness_function: "var_validation_time"
# fitness_function: "validation_distribution_entropy"
# fitness_function: "message_entropy_integral"
# fitness_function: "message_entropy_average"
# fitness_function: "markov_matrix_non_similarity"

max_parallel_workers: 1  # 同时运行的最大实例数（改为3防止Docker资源竞争）；若设为 1，则会把 Rocket 的 stdout/stderr 打印到屏幕（用于交互调试）

individual_timeout_sec: 300 # TODO